
name: Beat Up Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find Android project or extract ZIP
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""

          find_project() {
            find "$1" \
              -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.gradle/*' \
              -print -quit
          }

          SETTINGS="$(find_project "$GITHUB_WORKSPACE")"

          if [ -z "$SETTINGS" ]; then
            while IFS= read -r ZIP; do
              echo "Extracting: $ZIP"
              mkdir -p "$RUNNER_TEMP/beatup-source"
              unzip -oq "$ZIP" -d "$RUNNER_TEMP/beatup-source"
              SETTINGS="$(find_project "$RUNNER_TEMP/beatup-source")"
              if [ -n "$SETTINGS" ]; then
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip')
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Android Gradle project was found."
            echo "Upload the source project files or a ZIP containing them."
            echo "The project must contain settings.gradle.kts or settings.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Beat Up APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beat-up-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
