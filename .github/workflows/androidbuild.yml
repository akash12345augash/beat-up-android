
name: Beat Up Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for p in root.rglob("*.gradle.kts"):
              if ".gradle" in p.parts or "build" in p.parts:
                  continue
              s = p.read_text()
              if p.name == "build.gradle.kts" and "app" in p.parts:
                  if "compileOptions" in s:
                      import re
                      s = re.sub(
                          r'JavaVersion\.VERSION_1_8',
                          'JavaVersion.VERSION_17', s
                      )
                  else:
                      s += """
          
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
                  if "kotlinOptions" not in s and "compilerOptions" not in s:
                      s += """
          
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """
                  p.write_text(s)
          PY

      - name: Build Beat Up APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beat-up-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
