
      - name: Find Android project or extract ZIP
        shell: bash
        run: |
          set -e
          SEARCH_DIR="$GITHUB_WORKSPACE"

          find_settings() {
            find "$1" -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.gradle/*' -print -quit
          }

          SETTINGS="$(find_settings "$SEARCH_DIR")"

          if [ -z "$SETTINGS" ]; then
            while IFS= read -r -d '' ZIPFILE; do
              echo "Extracting project ZIP: $ZIPFILE"
              DEST="$RUNNER_TEMP/beatup-extracted"
              mkdir -p "$DEST"
              unzip -oq "$ZIPFILE" -d "$DEST"
              SETTINGS="$(find_settings "$DEST")"
              if [ -n "$SETTINGS" ]; then
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -print0)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle project found."
            echo "The repository must contain Android source files or a ZIP containing them."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"
