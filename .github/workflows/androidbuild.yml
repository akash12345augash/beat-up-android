
name: Beat Up Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract fixed project
        run: |
          ZIP_FILE="BeatUp-JVM-Fixed.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Upload BeatUp-JVM-Fixed.zip to repository root."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .
          echo "Checking Java and Kotlin targets:"
          grep -A 4 'compileOptions' app/build.gradle.kts
          grep -A 2 'kotlinOptions' app/build.gradle.kts
          grep -q 'VERSION_17' app/build.gradle.kts
          grep -q 'jvmTarget = "17"' app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beat-up-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
